{{define "content"}}
<h1 style="margin-bottom: 32px;">Settings</h1>
{{if .Message}}
<div class="alert info">
    <span class="material-symbols-rounded">info</span> {{.Message}}
</div>
{{end}}
<div class="card max-w-600">
    <form method="POST">
        {{.CSRFField}}
        <div class="form-group">
            <label>Shared Path (Directory)</label>
            <input type="text" name="shared_path" value="{{.Config.SharedPath}}" required>
        </div>
        
        <div style="display: flex; gap: 16px; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1;">
                <label>WebDAV Port</label>
                <input type="number" name="webdav_port" value="{{.Config.WebDAVPort}}" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Web Interface Port</label>
                <input type="number" name="web_ui_port" value="{{.Config.WebUIPort}}" required>
            </div>
        </div>

        <div class="form-group" style="margin-top: 8px;">
            <label>Maximum Log File Size (Auto-Rotation)</label>
            <div style="display: flex; gap: 16px;">
                <div style="flex: 2;">
                    <input type="number" name="log_max_size" id="logMaxSizeInput" value="{{.Config.LogMaxSize}}" min="1" required style="width: 100%; padding: 16px; background: var(--md-surface-container-high); border: 1px solid transparent; border-radius: 12px; font-size: 1rem; color: var(--md-on-surface); outline: none; transition: opacity 0.2s ease;">
                </div>
                <div style="flex: 1;">
                    <select name="log_max_unit" id="logMaxUnitSelect" onchange="toggleLogSizeInput()" style="width: 100%; padding: 16px; background: var(--md-surface-container-high); border: 1px solid transparent; border-radius: 12px; font-size: 1rem; color: var(--md-on-surface); outline: none; cursor: pointer; appearance: auto;">
                        <option value="KB" {{if eq .Config.LogMaxUnit "KB"}}selected{{end}}>KB</option>
                        <option value="MB" {{if eq .Config.LogMaxUnit "MB"}}selected{{end}}>MB</option>
                        <option value="GB" {{if eq .Config.LogMaxUnit "GB"}}selected{{end}}>GB</option>
                        <option value="UNLIMITED" {{if eq .Config.LogMaxUnit "UNLIMITED"}}selected{{end}}>Unlimited (Disable rotation)</option>
                    </select>
                </div>
            </div>
            <small style="margin-top: 8px; color: var(--md-on-surface-variant);">
                <span class="material-symbols-rounded" style="font-size: 14px;">autorenew</span> 
                When server.log reaches this size, it will be automatically archived. Choose Unlimited to keep a single infinite log.
            </small>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 24px;">
            <span class="material-symbols-rounded">save</span> Save Settings
        </button>
    </form>
</div>

<!-- JS SCRIPT TO TOGGLE INPUT WHEN UNLIMITED IS SELECTED -->
<script>
    function toggleLogSizeInput() {
        const unitSelect = document.getElementById('logMaxUnitSelect');
        const sizeInput = document.getElementById('logMaxSizeInput');
        if (unitSelect.value === 'UNLIMITED') {
            sizeInput.disabled = true;
            sizeInput.style.opacity = '0.4';
            sizeInput.required = false;
        } else {
            sizeInput.disabled = false;
            sizeInput.style.opacity = '1';
            sizeInput.required = true;
        }
    }
    document.addEventListener('DOMContentLoaded', toggleLogSizeInput);
</script>

<!-- AUTOMATIC REDIRECT TO NEW PORT IF CHANGED -->
{{if .NewUIPort}}
<script>
    setTimeout(() => {
        const newPort = "{{.NewUIPort}}";
        window.location.href = window.location.protocol + "//" + window.location.hostname + ":" + newPort + "/settings";
    }, 1000);
</script>
{{end}}
{{end}}
